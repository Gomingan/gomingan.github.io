name: Build Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install (네트워크 일시 오류 대비 3회 재시도)
        run: |
          for i in 1 2 3; do
            npm install && exit 0
            echo "npm install 실패 ($i/3), 20초 뒤 재시도"; sleep 20
          done
          exit 1
      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r icons www/icons
          cp -r audio www/audio
          cp -r cats www/cats
          cp -r bg www/bg
          cp -r items www/items
          # 아직 공개하지 않는 고양이는 앱에서 뺍니다 (HIDDEN_CATS 와 같은 목록)
          rm -rf www/cats/white www/cats/calico www/cats/ragdoll www/cats/bengal www/cats/silver www/cats/mainecoon
      - name: Add Android platform
        run: npx cap add android
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK (for phone testing)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pawlight-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release AAB (only if keystore secrets exist)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          # 출시용 빌드: 테스트 무료 모드를 끕니다
          sed -i 's/var TEST_FREE=true/var TEST_FREE=false/' app/src/main/assets/public/index.html
          grep -q 'var TEST_FREE=false' app/src/main/assets/public/index.html
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: pawlight-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
