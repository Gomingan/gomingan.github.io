<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><meta name=theme-color content='#11162d'><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content=Pawlight><link rel=manifest href=manifest.json><link rel=apple-touch-icon href=icons/apple-touch-icon.png><title>Pawlight v0.9</title><style>*{box-sizing:border-box}body{margin:0;background:#11162d;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#a{width:min(96vw,460px);text-align:center}
.top,.bar{display:flex;justify-content:space-between;align-items:center;margin:7px;color:#d2d5e8}.top button,.bar button{padding:4px 8px;font-size:14px}
.screen{display:none}.screen.active{display:block}
.homeScene,.scene{position:relative;width:100%;aspect-ratio:1024/1536;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff14}
.homeScene img.bg,.scene img.bg{width:100%;height:100%;object-fit:cover;display:block}
.scene{aspect-ratio:1024/998}
.scene img.bg{object-position:center top}
#clearScreen .homeScene{aspect-ratio:1024/650}
#homeScreen .homeScene{aspect-ratio:1024/1152}
#homeScreen .homeScene img.bg{object-position:center top}
.winSlot{position:absolute;left:22.95%;top:33.05%;width:52.25%;height:38.06%;display:flex;align-items:center;justify-content:center}
.winSlot canvas{height:100%;width:100%;max-width:100%;max-height:100%;aspect-ratio:1/1;background:#15192dcc;border-radius:10px;box-shadow:0 0 18px #000000aa;touch-action:manipulation}
.cat{position:absolute;filter:drop-shadow(0 6px 8px #00000066);z-index:5}
.paw{position:absolute;opacity:0;font-size:34px;pointer-events:none;transform:translate(-50%,15px);transition:.1s;z-index:6}
.paw.on{opacity:1;transform:translate(-50%,-8px)}
.msg{height:24px;color:#ffdda7;margin:5px}.remain{font-weight:800;font-size:18px;color:#ffd867}.danger{color:#ff7788}
button{border:0;border-radius:9px;background:#413a59;color:#fff;padding:8px 13px;margin:4px;cursor:pointer}
.bigBtn{display:block;width:100%;text-align:left;padding:13px 16px;font-size:15px;margin:8px 0;background:#332c4d;border-radius:14px}
.tagline{color:#cdd1ea;font-size:13px;margin:10px 0 4px}
.speech{color:#9aa0c2;font-size:12px;margin-top:6px;font-style:italic}
.modal{position:fixed;inset:0;background:#050713cc;display:none;place-items:center;z-index:20}.modal.on{display:grid}
.card{width:min(86vw,340px);max-height:80vh;overflow:auto;background:#28243d;border-radius:20px;padding:20px}
.ad{background:#6d55d9}.stat{display:none;font-size:12px;color:#aeb5ce;margin:4px}.stat.show{display:block}
.legend{font-size:11px;color:#aeb5ce;margin:5px}
.spark{position:fixed;z-index:30;pointer-events:none;color:#ffe87a;font-size:18px;text-shadow:0 0 10px #ffd34d;transition:transform .75s ease-in,opacity .75s}
.scene.glow{box-shadow:inset 0 0 35px #ffe89799,0 0 24px #ffd85c55}
.shopRow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px}
.streak{color:#ffb26b}
.clearStars{font-size:34px;margin:8px 0;letter-spacing:4px}
.clearTitle{font-size:22px;font-weight:800;color:#ffe9a8;margin:10px 0 2px;letter-spacing:1px}
.clearReward{color:#ffd867;font-weight:800;margin:4px 0 14px;display:flex;gap:18px;justify-content:center}
.rewardItem{background:#0000003d;border-radius:10px;padding:4px 12px}
.starEmpty{filter:grayscale(1) brightness(.55);opacity:.55}
.starFilled{text-shadow:0 0 10px #ffd45c}

.pbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0}
.pill{background:#1c1f38cc;border-radius:20px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px}
.pauseBtn{background:#2c2f52;border-radius:10px;padding:8px 11px}
.legendCard{position:absolute;right:3%;top:3%;background:#141733d9;border-radius:12px;padding:8px 10px;font-size:11px;color:#dfe2f5;line-height:1.9;text-align:left;z-index:4}
.actionRow{display:flex;gap:6px;margin-top:8px}
.actionRow button{flex:1;background:#332c4d;border-radius:14px;padding:11px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.actionRow button b{font-size:15px}
.testBtn{position:absolute;left:3%;top:3%;background:#5c2c3ecc;border-radius:10px;padding:6px 9px;font-size:11px;z-index:4}
.dailyCard{background:#1c1f38cc;border-radius:14px;padding:11px 14px;margin:10px 0;text-align:left;font-size:13px;line-height:1.6}
.dailyCard b{color:#ffe27a}
.decorItem{position:absolute;z-index:4;pointer-events:none}
.wiggle{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.tabRow{display:flex;gap:6px;margin-bottom:10px}
.tabBtn{flex:1;background:#241f3a;border-radius:10px;padding:8px;font-size:13px}
.tabBtn.active{background:#4a3f75}
.memEntry{background:#1c1f38aa;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;text-align:left}
.memLocked{opacity:.4}
.cameraBtn{position:absolute;right:4%;bottom:4%;background:#000000aa;border-radius:50%;width:44px;height:44px;font-size:20px;z-index:6;display:flex;align-items:center;justify-content:center;padding:0}
.photoToast{height:18px;font-size:12px;color:#ffdda7;margin-top:2px}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photoCard{background:#1c1f38aa;border-radius:10px;padding:6px;font-size:10px;line-height:1.4}
.photoCard img{width:100%;border-radius:6px;background:#00000040;display:block}
.viewfinder{position:absolute;width:72px;height:72px;border:3px solid #ffffffcc;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:8;box-shadow:0 0 0 2000px #00000055, 0 0 14px #000a}
.viewfinder.active{display:block}
.viewfinder::before,.viewfinder::after{content:'';position:absolute;background:#ffffffcc}
.viewfinder::before{left:50%;top:-9px;width:2px;height:9px;transform:translateX(-50%)}
.viewfinder::after{left:-9px;top:50%;width:9px;height:2px;transform:translateY(-50%)}



html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}img{-webkit-user-drag:none}
.aimCancel{position:absolute;right:4%;top:4%;width:44px;height:44px;border-radius:50%;background:#000000bb;font-size:18px;z-index:9;align-items:center;justify-content:center;padding:0}
.homeScene.aiming{touch-action:none}
.viewfinder.locked{border-color:#ffd45c;box-shadow:0 0 0 2000px #00000055,0 0 20px #ffd45c}
.homeScene.shot{animation:shotFlash .26s ease-out}
@keyframes shotFlash{0%{filter:brightness(2.4)}100%{filter:none}}
/* 모바일 점검: 터치 영역 최소 44px, 주소창이 변하는 브라우저에서 화면 높이 보정 */
button{min-height:44px;min-width:44px}
body{min-height:100vh;min-height:100dvh}
</style></head>
<body><div id=a>
<div class=top id=topbar><b>🐾 PAWLIGHT</b><span id=wallet>⭐ 0</span><span id=moonWallet>🌙 0</span><span><button id=shopBtn>🛍️ 상점</button><button id=dbgBtn style="display:none">⚙</button></span></div>

<div id=homeScreen class="screen active">
  <div class=homeScene><img class=bg id=homeBg src=""><img class=cat id=homeCat src="" style="left:37%;bottom:13%;height:20%;width:auto"><div id=decorSlot></div><div class=viewfinder id=viewfinder></div><button class=cameraBtn id=cameraBtn onclick="enterAimMode()">📷</button><button class=aimCancel id=aimCancel onclick="cancelAim()" style="display:none">✕</button></div>
  <div class=photoToast id=photoToast></div>
  <p class=tagline>작은 별빛이, 더 따뜻한 하루를 만들어줘.</p>
  <div class=dailyCard id=dailyCard></div>
  <button class=bigBtn onclick="goPuzzle()">🌙 &nbsp;퍼즐하기</button>
  <button class=bigBtn onclick="openShop('theme')">🧺 &nbsp;방 꾸미기</button>
  <button class=bigBtn onclick="openMemory()">📖 &nbsp;작은 추억</button>
  <div class=speech>"오늘도 좋은 밤이 되길..."</div>
</div>

<div id=puzzleScreen class=screen>
  <div class=pbar>
    <span class=pill>STAGE <span id=stageNum></span></span>
    <span class=pill>🐾 <span id=pawCount></span></span>
    <span class=pill>⭐ <span id=starCount2></span></span>
    <button class=pauseBtn onclick="switchScreen('home')">⏸</button>
  </div>
  <div class=scene id=scene>
    <img class=bg id=sceneImg src="">
    <div class=winSlot><canvas id=c width=420 height=420></canvas></div>
    <img class=cat id=cat src="" style="left:30%;bottom:6%;height:17%;width:auto">
    <div class=paw id=paw>🐾</div>
    <div class=legendCard>🔒 고정<br>⭐ 별<br>😴 졸림<br>☁️ 구름<br>✨ 반짝이</div>
    <button class=testBtn onclick="instantClear()" style="display:none">🧪 바로 클리어</button>
  </div>
  <div class=msg id=msg></div><div class=bar><span id=diff></span><span id=streak class=streak></span></div>
  <div class=stat id=stat></div>
  <div class=actionRow>
    <button onclick=hint()>💡<b>힌트 5⭐</b></button>
    <button onclick=retry()>🔄<b>다시하기</b></button>
  </div>
</div>

<div id=clearScreen class=screen>
  <div class=homeScene><img class=bg id=clearBg src=""></div>
  <div class=clearTitle>STAGE CLEAR!</div>
  <div class=clearStars id=clearStars></div>
  <div class=clearReward id=clearReward></div>
  <button class=bigBtn onclick="goNext()">▶ &nbsp;다음 스테이지</button>
  <button class=bigBtn onclick="switchScreen('home')">🏠 &nbsp;방으로 가기</button>
</div>

</div>
<div class=modal id=modal><div class=card><div style='font-size:52px'>😿</div><h3>앞발을 다 썼어요</h3><p id=fmsg></p><button class=ad onclick=extend()>▶ 광고 보상 +5 🐾</button><br><button onclick=retry()>다시 도전</button></div></div>
<div class=modal id=shopModal><div class=card><h3>🛍️ 냥이 상점</h3><div class=tabRow><button class=tabBtn id=tabTheme onclick="switchShopTab('theme')">🎨 테마</button><button class=tabBtn id=tabDecor onclick="switchShopTab('decor')">🧶 소품</button></div><div id=shopList></div><button onclick="shopModal.classList.remove('on')">닫기</button></div></div>
<div class=modal id=memoryModal><div class=card><h3>📖 작은 추억</h3><p id=memoryBody style="color:#cdd1ea;line-height:1.7"></p><button onclick="memoryModal.classList.remove('on')">닫기</button></div></div>

// "from" 스테이지부터 해당 size(그리드 한 변)를 씁니다. 다음 구간의 from 전까지 유지돼요.
// 기본값: 4x4를 1~15스테이지까지 오래 유지(가볍게 반복 플레이) → 5x5(16~40) → 6x6(41~80) → 7x7(81~, 숙련자용)
const SIZE_CONFIG = {
  thresholds: [
    {from:1,  size:4},
    {from:16, size:5},
    {from:41, size:6},
    {from:81, size:7}
  ]
};
function gridSizeForStage(stage){
  let size = SIZE_CONFIG.thresholds[0].size;
  for(const t of SIZE_CONFIG.thresholds){ if(stage>=t.from) size=t.size; }
  return size;
}

const decorItems = {
  yarn:{name:'실뭉치', emoji:'🧶', cost:20},
  fish:{name:'물고기 장난감', emoji:'🐟', cost:30},
  plant:{name:'화분', emoji:'🪴', cost:15},
  basket:{name:'바구니', emoji:'🧺', cost:25}
};
function renderDecorSlot(){
  decorSlot.innerHTML = equippedDecor.map((k,idx)=>{
    let d=decorItems[k]; if(!d) return '';
    return `<span class="decorItem wiggle" style="left:${58+idx*11}%;bottom:${7+idx*4}%;font-size:26px">${d.emoji}</span>`;
  }).join('');
}
function buyDecor(k){
  let d=decorItems[k];
  if(ownedDecor.includes(k)){
    if(equippedDecor.includes(k)){equippedDecor=equippedDecor.filter(x=>x!==k)}
    else{if(equippedDecor.length>=2)equippedDecor.shift();equippedDecor.push(k)}
  } else {
    if(moon<d.cost){msg.textContent='🌙 달빛이 부족해요';renderShop();return}
    moon-=d.cost;localStorage.pawMoon=moon;moonWallet.textContent='🌙 '+moon;
    ownedDecor.push(k);localStorage.pawDecorOwned=JSON.stringify(ownedDecor);
    if(equippedDecor.length>=2)equippedDecor.shift();equippedDecor.push(k);
  }
  localStorage.pawDecorEquipped=JSON.stringify(equippedDecor);
  renderShop();renderDecorSlot();
}

const POSE_POOL = [
  {k:'idle', w:50},
  {k:'lookup', w:20},

let currentPose='idle', homePoseTimer=null;
function pickPose(){
  let total=POSE_POOL.reduce((a,p)=>a+p.w,0), r=Math.random()*total;
  for(const p of POSE_POOL){ if(r<p.w) return p.k; r-=p.w; }
  return 'idle';
}
function cycleHomePose(){ currentPose=pickPose(); homeCat.src=IMG['cat_'+currentPose].src; }
function startHomePoseCycle(){
  cycleHomePose();
  if(homePoseTimer) clearInterval(homePoseTimer);
  homePoseTimer=setInterval(cycleHomePose, 3500+Math.random()*2500);
}
function stopHomePoseCycle(){ if(homePoseTimer){clearInterval(homePoseTimer);homePoseTimer=null} }
function takePhoto(){
  let photos=JSON.parse(localStorage.pawPhotos||'[]');
